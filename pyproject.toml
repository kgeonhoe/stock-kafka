[project]
name = "stock-kafka"
version = "0.1.0"
description = "Korean Investment Securities Kafka Pipeline for NASDAQ Stock Trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "pandas>=2.1.4",
    "numpy>=1.24.3",
    "duckdb>=0.9.2",
    # Kafka
    "kafka-python>=2.0.2",
    "confluent-kafka>=2.3.0",
    # API and HTTP
    "requests>=2.31.0",
    "aiohttp>=3.9.1",
    "websockets>=12.0",
    # Technical Analysis
    "pandas-ta>=0.3.14b0",
    "yfinance>=0.2.18",
    "ta>=0.10.2",
    # Caching
    "redis>=5.0.1",
    "hiredis>=2.2.3",
    # Dashboard
    "streamlit>=1.29.0",
    "plotly>=5.17.0",
    "altair>=5.2.0",
    # Data Processing
    "scipy>=1.11.4",
    "scikit-learn>=1.3.2",
    # Configuration
    "pydantic>=2.5.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Logging
    "loguru>=0.7.2",
    # Task scheduling
    "apscheduler>=3.10.4",
    # Async support
    "uvloop>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "black>=23.12.1",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
